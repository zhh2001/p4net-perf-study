# Reviewer 1, Concern 4: clean RQ3 run-level replication campaign.
# All six configurations from rq3_full.yaml are retained, with five fresh
# topology/BMv2 restarts per configuration and a randomized 30-cell schedule.

campaign:
  name: rq3_c4_clean_restarts
  seed: 42
  warmup_seconds: 30
  cooldown_seconds: 30
  shuffle_all_cells: true

x-int-multihop: &int_multihop
  {rq: 3, workload_type: int_multihop, p4_program: l3_lpm_int_chain,
   topology: linear_n, n_probes: 1000, repetitions: 5,
   probe_interval_ms: 60.0, packet_size_bytes: 256}

configs:
  - {<<: *int_multihop, n_switches: 2, background_load_mbps: 0}
  - {<<: *int_multihop, n_switches: 2, background_load_mbps: 25}
  - {<<: *int_multihop, n_switches: 2, background_load_mbps: 45}
  - {<<: *int_multihop, n_switches: 3, background_load_mbps: 0}
  - {<<: *int_multihop, n_switches: 3, background_load_mbps: 25}
  - {<<: *int_multihop, n_switches: 3, background_load_mbps: 45}
